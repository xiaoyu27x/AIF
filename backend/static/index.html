<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/style.css?v=20261024language1"><link rel="stylesheet" href="/static/language.css?v=20261024promptfix2"><title>AI 女友</title>
<body><main class="workspace">
  <aside class="role-rail" id="roles"></aside>
  <aside class="portrait-panel"><img id="portrait" src="/static/zhang-yun.jpg" alt="角色头像"><div class="portrait-info"><p class="eyebrow">ONLINE · QWEN3.5</p><h1 id="portrait-name">张韵</h1><p>今天忙不忙？</p></div><label class="change-avatar" data-i18n="changeAvatar">更换头像<input id="avatar-input" type="file" accept="image/jpeg,image/png,image/webp" hidden></label></aside>
  <section class="chat-panel"><header><span id="title">张韵</span><p id="description">温柔、独立，带一点俏皮害羞的女同事。</p><button class="quiet" id="preferences" data-i18n="language">语言</button><button class="quiet" id="edit-profile" data-i18n="myName">我的名字</button><button class="quiet" id="edit" data-i18n="editRole">编辑角色</button><button class="quiet" id="clear-history" data-i18n="clearHistory">清空记录</button><button class="quiet" id="logout" data-i18n="logout">退出</button></header><section id="messages"></section><form id="chat"><textarea name="message" placeholder="说点什么…" rows="1" required></textarea><button data-i18n="send">发送</button></form></section>
</main>
<dialog id="editor"><input id="role-name" placeholder="名字"><label>角色性别<select id="role-gender"><option value="female">女性</option><option value="male">男性</option></select></label><label>对话引擎<select id="role-engine"><option value="native">原有方案（内置记忆 / 关系 / 时间）</option><option value="sillytavern">SillyTavern + 扩展</option></select><small id="role-engine-status">选择后按角色单独保存</small></label><textarea id="role-prompt" rows="12" placeholder="角色设定"></textarea><input id="role-affection" type="number" min="0" max="100" placeholder="情感值（0–100，留空不改）"><input id="role-friendship" type="number" min="0" max="100" placeholder="友谊值（0–100，留空不改）"><button id="save-role">保存</button><button onclick="editor.close()">取消</button></dialog>
<dialog id="profile-editor"><h2 data-i18n="myName">我的名字</h2><input id="profile-name" maxlength="32" placeholder="请输入你的名字"><button id="save-profile" data-i18n="save">保存</button><button data-i18n="cancel" onclick="document.querySelector('#profile-editor').close()">取消</button></dialog>
<dialog id="preferences-editor"><h2 data-i18n="languageSettings">语言设置</h2><label data-i18n="chatLanguage">对话语言<select id="chat-language"><option value="zh-CN">简体中文</option><option value="en-US">English</option><option value="ja-JP">日本語</option><option value="ko-KR">한국어</option><option value="es-ES">Español</option><option value="fr-FR">Français</option><option value="de-DE">Deutsch</option></select></label><label data-i18n="uiLanguage">界面语言<select id="ui-language"><option value="zh-CN">简体中文</option><option value="en-US">English</option><option value="ja-JP">日本語</option><option value="ko-KR">한국어</option></select></label><button id="save-preferences" data-i18n="save">保存</button><button data-i18n="cancel" onclick="document.querySelector('#preferences-editor').close()">取消</button></dialog>
<script src="/static/app.js?v=20261024enginechoice1"></script></body></html>
