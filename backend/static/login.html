<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><style>[hidden]{display:none!important}.code-row{display:flex;gap:10px}.code-row input{min-width:0}.auth-switch{margin-top:14px}#error{display:block;margin-top:14px;font-size:15px;line-height:1.5}.model-choice{display:grid;gap:7px;color:#f6d6e7;font-size:14px}.model-choice select{width:100%;padding:12px;border:1px solid #79647d;border-radius:12px;background:#352c46;color:#fff;font:inherit}</style><title>心语 · 登录</title>
<body class="login"><main class="card"><p class="eyebrow">YOUR PRIVATE COMPANION</p><h1>心语</h1><p id="intro">今晚，想和我聊些什么？</p>
<form id="login"><input name="username" placeholder="邮箱或用户名" required autocomplete="username"><input name="password" type="password" placeholder="密码" required autocomplete="current-password"><label class="model-choice">登录模型<select name="model_provider"><option value="ollama">本地千问（本机 GPU）</option><option value="openai">ChatGPT（OpenAI API）</option></select></label><button>开始聊天</button></form>
<button class="quiet auth-switch" type="button" id="show-register">邮箱注册</button>
<form id="register" hidden><input name="email" type="email" placeholder="邮箱" required autocomplete="email"><div class="code-row"><input name="code" inputmode="numeric" maxlength="6" placeholder="6 位验证码" required><button type="button" id="send-code">获取验证码</button></div><input name="name" placeholder="你的名字（她会这样称呼你）" required autocomplete="name"><select name="timezone" aria-label="国家和时区"><option value="Asia/Shanghai">中国 · 北京时间</option><option value="Asia/Tokyo">日本 · 东京时间</option><option value="Asia/Seoul">韩国 · 首尔时间</option><option value="Asia/Singapore">新加坡 · 新加坡时间</option><option value="Asia/Kolkata">印度 · 新德里时间</option><option value="Europe/London">英国 · 伦敦时间</option><option value="Europe/Paris">法国/中欧 · 巴黎时间</option><option value="America/New_York">美国东部 · 纽约时间</option><option value="America/Chicago">美国中部 · 芝加哥时间</option><option value="America/Denver">美国山地 · 丹佛时间</option><option value="America/Los_Angeles">美国西部 · 洛杉矶时间</option><option value="Australia/Sydney">澳大利亚 · 悉尼时间</option></select><input name="password" type="password" placeholder="密码（至少 8 位）" required autocomplete="new-password"><input name="confirm_password" type="password" placeholder="确认密码" required autocomplete="new-password"><button>验证并创建账户</button></form>
<button class="quiet auth-switch" type="button" id="show-login" hidden>返回登录</button><small id="error"></small></main>
<script>const $=s=>document.querySelector(s),err=$('#error'),login=$('#login'),reg=$('#register');function showRegister(){login.hidden=true;reg.hidden=false;$('#show-register').hidden=true;$('#show-login').hidden=false;$('#intro').textContent='用邮箱验证码创建你的专属账户';err.textContent=''}function showLogin(){login.hidden=false;reg.hidden=true;$('#show-register').hidden=false;$('#show-login').hidden=true;$('#intro').textContent='今晚，想和我聊些什么？';err.textContent=''}$('#show-register').onclick=showRegister;$('#show-login').onclick=showLogin;login.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',body:new FormData(login)});if(r.ok)location='/';else err.textContent='登录失败，请检查邮箱/用户名和密码'};$('#send-code').onclick=async()=>{const email=reg.elements.email.value.trim();if(!email)return err.textContent='请先填写邮箱';const fd=new FormData();fd.append('email',email);const r=await fetch('/api/register/send-code',{method:'POST',body:fd}),j=await r.json();err.textContent=r.ok?'验证码已发送，请查收邮箱。':j.detail||'发送失败'};reg.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/register',{method:'POST',body:new FormData(reg)}),j=await r.json();if(r.ok)location='/';else err.textContent=j.detail||'注册失败'};</script></body></html>
